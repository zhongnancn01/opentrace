name: Build HopTrace APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

          # Android 17 is published as android-37.0. Some AGP tooling still
          # resolves compileSdk 37 through the legacy android-37 directory.
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK root was not provided by setup-android" >&2
            exit 1
          fi

          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && \
             [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi

          test -s "$SDK_ROOT/platforms/android-37/android.jar"
          echo "Android 17 SDK is ready at $SDK_ROOT/platforms/android-37"

      # This project ZIP does not include gradle-wrapper.jar. Install the
      # exact Gradle version required by AGP 9.5.0 on the runner instead.
      - name: Install Gradle 9.6.0
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION="9.6.0"
          ZIP_PATH="$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            --output "$ZIP_PATH"
          unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build HopTrace debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --console=plain assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: HopTrace-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
