name: Build HopTrace APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK, NDK and CMake packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      # The source ZIP intentionally does not contain gradle-wrapper.jar.
      # Download the exact Gradle version required by AGP 9.5.0 instead of
      # invoking the incomplete ./gradlew script.
      - name: Install Gradle 9.6.0
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION="9.6.0"
          ZIP_PATH="$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            --output "$ZIP_PATH"
          unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build HopTrace debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --console=plain assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: HopTrace-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
